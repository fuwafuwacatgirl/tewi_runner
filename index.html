<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tewi Runner</title>
<style>
html,body{
  margin:0;
  height:100%;
  background:#181818;
  display:grid;
  place-items:center;
  font-family:monospace;
}
canvas{
  width:640px;
  height:576px;
  max-width:96vw;
  max-height:96vh;
  image-rendering:pixelated;
  border:2px solid #555;
}
</style>
</head>
<body>
<canvas id="game" width="160" height="144"></canvas>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

// ==========================
// Palette
// ==========================
const C=[
  "#1a1c2c",
  "#5d275d",
  "#b13e53",
  "#ef7d57",
  "#ffcd75",
  "#a7f070",
  "#38b764",
  "#257179"
];

// ==========================
// Sprites
// ==========================
// Generated by Playload Sprite Packer
const SPRITE_PALETTE=[[0,0,0,0],[253,239,232,255],[22,11,11,255],[115,66,66,255],[226,203,203,255],[204,163,172,255],[255,185,185,255],[226,38,38,255]];
// frame: [offsetX,offsetY,width,height,mode,base64,name]
const SPRITES_p=[
  [6,4,18,26,"r","IBEiQCEqKCkyGDEiAwIQMQQCAwoTAggxKgMKCDESBTIpBBIJAgUaBBkECgQCAQIBBCIMAQQSEQIJShYJAgkKCAIAGgUEKQIYAgAaBQQZAkAKBA4IAkgEJjgcBgEeMAQWCQQWBDAGBw4JDgwFDCBGBAAMIAYHRjhOQAYHBgcGBwYHBjAEDTYwDA0YBAkwDAUoETAMKAQJKA==","frame-1.png"],
  [5,4,19,27,"r","IBFoKRo4MSogOTIYOSIDAhgxBAIDChMCECkEKgMKCAIEGQQaBSIICgwBBCIJAgUSAEIEAgECAQQSAEIRAgkKAzoWCQIJChAqBQQpChACCBoFBBkKQAoEDgQAAlAEJkAcLjgELgEOQAYHJgEMQDYJBEAOBx4JBgRATkgGBwYHBgcGBwZQNlgZBQRgBAkADIAUOA==","frame-2.png"],
  [6,4,19,26,"r","IBEiSCEqKDEyGDkiAwIYMQQCAwoTAhAxKgMKECkEEgUiCAIEGQQaCQIFEgAKDAEEEgQCAQIBBBIAQhECCQoAOhYJAgkKEAIAGgUEKQIQAhAaBQQZAkgKBA4QAkgEJkgUHgEGOAQ2BAYBOAYHLhQJKEYEAAkoBgdGQA4HNkgWBwYHBgcGOAEMDhQOOAkMGAUMOAkEKBQ4CSgFDDA=","frame-3.png"],
  [5,5,19,26,"r","IBEiSCEqMCkyIDEiAwIYMQQCAwoTAhAxKgMKCAIxEgUiCAIpBBIJAgUSAAIEGQQKBAIBAgEEEgAKDAEEEhECCRIDMhYJAgkKECoFBCkCGAIIGgUEGQJICgQOBAIIAkAEJkAcLjgELgEOQAYHJgEMQDYJDDgGByYJDkAeByZIBgcWBwYHBlA2WCQBYAUMAAmAETg=","frame-4.png"],
  [7,3,18,28,"r","KDJAAhEyKAIhMhgCKSIDAhACMQIDChMCCDEEIgMKCDESBQEqMRIBAgEFGikEAgQCAQIBBBoEGQQKEQIJIgwBBAIWIQoAMgUEIQQCEAIAIgUkAiAqBA4SOAoABB4CWCZYBB4JUCYJQAQmDEA+BDgGB0YwVjgOBwYHBgcGBwZINmAFDHAECXgECXgEATA=","frame-6.png"],
  [4,4,20,27,"r","KBFwKRpAMSooOTIgOTIgMQQiAwoYKQQKAwoTCggCBBkEMgMSABIMAQQiBSoAWgkCBRIAShECCQoDQhYJAgkKEDIFBBECCQoIAgMCAAMaBSEEAkgKDBEEWAQmSBweCQQ4BD4JBDgGBy4BBEg2HEAOBzYEBkBWSAYHBgcGBwYHBlg2DHgJHHARDHARKA==","frame-8.png"]
];

function drawPackedSprite(ctx,frame,x,y,scale=1){
  const [ox,oy,w,h,mode,s]=frame;
  const d=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  let p=0,bit=0;
  const put=(c)=>{
    if(c){
      const q=SPRITE_PALETTE[c];
      ctx.fillStyle=`rgba(${q[0]},${q[1]},${q[2]},${q[3]/255})`;
      ctx.fillRect(x+((p%w)+ox)*scale,y+(((p/w)|0)+oy)*scale,scale,scale);
    }
    p++;
  };
  if(mode==='r')for(const b of d){let n=(b>>3)+1,c=b&7;while(n--)put(c)}
  else while(p<w*h){let c=0;for(let k=0;k<3;k++){c=c<<1|((d[bit>>3]>>(7-(bit&7)))&1);bit++}put(c)}
}

// ==========================
// Game constants
// ==========================
const GROUND=120;
const PLAYER_X=22;
const PLAYER_W=32;
const PLAYER_H=32;

// ==========================
// Game state
// ==========================
let y=GROUND-PLAYER_H;
let vy=0;
let obstacleX=180;
let speed=1.5;
let score=0;
let dead=false;
let frame=0;

// ==========================
// Input
// ==========================
function action(){
  if(dead){
    reset();
    return;
  }
  // 地上にいる時だけジャンプ
  if(y>=GROUND-PLAYER_H){
    vy=-4.8;
  }
}

addEventListener("keydown",e=>{
  if(
    e.code==="Space" ||
    e.code==="KeyZ" ||
    e.code==="ArrowUp"
  ){
    e.preventDefault();
    action();
  }
});
canvas.addEventListener("pointerdown", action);

// ==========================
// Reset
// ==========================
function reset(){
  y=GROUND-PLAYER_H;
  vy=0;
  obstacleX=180;
  speed=1.5;
  score=0;
  dead=false;
  frame=0;
}

// ==========================
// Sprite selection (修正箇所1)
// ==========================
function getPlayerSprite(){
  // 空中
  if(y<GROUND-PLAYER_H){
    // 上昇中 (frame-6)
    if(vy<0){
      return SPRITES_p[4];
    }
    // 下降中 (frame-8)
    return SPRITES_p[5];
  }
  // 地上 RUN animation (frame-1〜4)
  const anim = Math.floor(frame/7)%4;
  return SPRITES_p[anim];
}

// ==========================
// Shadow
// ==========================
function drawShadow(x,y){
  const height= Math.max(0, (GROUND-PLAYER_H)-y);
  const width= Math.max(10, 22-height*0.15);
  ctx.fillStyle=C[0];
  ctx.fillRect(
    Math.round(x+8-width/2),
    GROUND-2,
    Math.round(width),
    2
  );
}

// ==========================
// Player (修正箇所2)
// ==========================
function drawPlayer(){
  const sprite = getPlayerSprite();
  const drawY = Math.round(y);
  drawPackedSprite(ctx, sprite, PLAYER_X, drawY, 1);
}

// ==========================
// Obstacle
// ==========================
function drawObstacle(x){
  // タケノコ本体
  ctx.fillStyle = C[3];
  ctx.beginPath();
  ctx.moveTo(x + 6, GROUND - 20);
  ctx.lineTo(x, GROUND);
  ctx.lineTo(x + 12, GROUND);
  ctx.closePath();
  ctx.fill();

  // タケノコの皮模様
  ctx.fillStyle = C[2];
  ctx.beginPath();
  ctx.moveTo(x + 3, GROUND - 8);
  ctx.lineTo(x + 6, GROUND - 5);
  ctx.lineTo(x + 9, GROUND - 8);
  ctx.lineTo(x + 6, GROUND - 6);
  ctx.closePath();
  ctx.fill();

  // 上側にも小さい皮模様
  ctx.beginPath();
  ctx.moveTo(x + 4, GROUND - 13);
  ctx.lineTo(x + 6, GROUND - 11);
  ctx.lineTo(x + 8, GROUND - 13);
  ctx.lineTo(x + 6, GROUND - 12);
  ctx.closePath();
  ctx.fill();
}

// ==========================
// Background
// ==========================
function drawBackground(){
  // 空
  ctx.fillStyle=C[7];
  ctx.fillRect(0, 0, 160, GROUND);

  // 太陽
  ctx.fillStyle=C[4];
  ctx.fillRect(125, 18, 12, 12);

  // 遠景 おやま
  ctx.fillStyle=C[5];
  const offset= (frame*0.15)%80;
  for(let i=-1;i<4;i++){
    const x= i*80-offset;
    ctx.beginPath();
    ctx.moveTo(x, GROUND);
    ctx.lineTo(x+32, 75);
    ctx.lineTo(x+65, GROUND);
    ctx.fill();
  }

  // 地面
  ctx.fillStyle=C[4];
  ctx.fillRect(0, GROUND, 160, 24);

  // 境界線
  ctx.fillStyle=C[3];
  ctx.fillRect(0, GROUND, 160, 2);

  // 流れる斜めハッチング
  const hatchOffset = (frame * speed) % 12;
  ctx.fillStyle = C[3];
  for (let x = -24 - hatchOffset; x < 180; x += 12) {
    for (let i = 0; i < 64; i++) {
      ctx.fillRect(Math.round(x + i), 122 + i, 2, 1);
    }
  }
}

// ==========================
// Collision
// ==========================
function collision(){
  const px= PLAYER_X+4;
  const py= y+5;
  const pw=20;
  const ph=27;

  const ox= obstacleX-3;
  const oy= GROUND-18;
  const ow=13;
  const oh=18;

  return(
    px < ox+ow &&
    px+pw > ox &&
    py < oy+oh &&
    py+ph > oy
  );
}

// ==========================
// Update
// ==========================
function update(){
  if(dead){
    return;
  }
  vy+=0.25;
  y+=vy;

  if(y>GROUND-PLAYER_H){
    y=GROUND-PLAYER_H;
    vy=0;
  }

  obstacleX-=speed;
  if(obstacleX<-15){
    obstacleX= 170+ Math.random()*70;
    speed+=0.08;
  }

  if(collision()){
    dead=true;
  }

  score++;
  frame++;
}

// ==========================
// Draw
// ==========================
function draw(){
  drawBackground();
  drawShadow(PLAYER_X, y);
  drawPlayer();
  drawObstacle(Math.round(obstacleX));

  // Score
  ctx.fillStyle=C[0];
  ctx.font= "8px monospace";
  ctx.fillText(String(score/6|0).padStart(5, "0"), 4, 10);

  // Game Over
  if(dead){
    ctx.fillStyle=C[0];
    ctx.fillRect(31, 48, 98, 35);
    ctx.fillStyle=C[4];
    ctx.textAlign="center";
    ctx.fillText("GAME OVER", 80, 61);
    ctx.fillText("Z / SPACE", 80, 74);
    ctx.textAlign="left";
  }
}

// ==========================
// Main loop
// ==========================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
